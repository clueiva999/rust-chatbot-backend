[package]
name    = "rust-chatbot-groq"
version = "0.1.0"
edition = "2021"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html



[dependencies]
# ─── async runtime & web stack
tokio              = { version = "1.37.0", features = ["full", "macros", "rt-multi-thread" ] }
axum               = { version = "0.7.5", features = ["ws", "macros"] }   # WebSocket + routing macros
tower-http         = { version = "0.5", features = ["cors"] }             # CORS support for browser WebSocket connections
futures-util       = "0.3"

# ─── logging & tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# ─── serialization / util
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
uuid               = { version = "1", features = ["v4", "serde"] }
dotenvy            = "0.15"
chrono             = { version = "0.4", features = ["serde"] }
anyhow             = "1"

# ─── HTTP client for your Next.js user‑context call
reqwest            = { version = "0.12", default-features = false,features = ["json", "gzip", "rustls-tls"] }

# ─── OpenAI‑compatible Groq client
async-openai       = { version = "0.28.3", default-features = false,features = ["rustls"] }

# ─── transcript service dependencies
dashmap            = "6.1.0"                                                   # Thread-safe HashMap for session management
thiserror          = "1.0"                                                     # Error handling derive macros

# ─── AWS S3 integration
aws-sdk-s3         = "1.55.0"                                                  # AWS S3 SDK
aws-config         = "1.5.8"                                                   # AWS configuration
tokio-retry        = "0.3"                                                     # Retry logic with exponential backoff
flate2             = "1.0"                                                     # Gzip compression for JSONL files

# ─── Database integration
sqlx               = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "derive"] }
